[project]
name = "agent-state-gate"
version = "0.5.0"
description = "Engineering governance integration layer for Context Graph and State-space Gate harness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "agent-state-gate-team"}
]

dependencies = [
    "alembic>=1.13",
    "opentelemetry-api>=1.24",
    "pydantic>=2.0",
    "pyjwt[crypto]>=2.8",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "requests>=2.28",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pip-audit>=2.7",
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
]

[project.scripts]
agent-state-gate = "agent_state_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_state_gate", "src"]

[tool.hatch.build]
exclude = [
    "/.coverage",
    "/.ctg",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/deep-research-report (9).md",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agent_state_gate"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B904", "E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
packages = ["agent_state_gate", "src"]
